[project]
name = "fengmou-backend"
version = "0.2.0"
description = "Backend MVP for construction evidence verification and trusted delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.5",
  "cryptography==49.0.0",
  "fastapi==0.140.7",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "starlette==1.3.1",
  "sqlalchemy==2.0.51",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "pytest==9.1.1",
  "pytest-cov==6.3.0",
]
# Optional standard-GPKG geometry stack (P1-2A). Install: uv sync --extra gpkg
# GeoPandas is intentionally NOT required. Fiona is not the primary API.
gpkg = [
    "pyogrio==0.13.0",
    "pyproj==3.7.2",
    "shapely==2.1.2",
]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.uv]
required-version = "==0.11.32"
python-preference = "only-system"
build-constraint-dependencies = ["setuptools==83.0.0"]
